# Main config baked into the image at /etc/nginx/nginx.conf
# (/usr/local/openresty/nginx/conf/nginx.conf is a symlink to it, so the
# stock `openresty -g "daemon off;"` CMD and `openresty -t` both use it).
#
# Overridable without rebuilding:
#   /etc/nginx/nginx.conf          replace this file entirely
#   /etc/nginx/conf.d/*.conf       http{} level: default.conf lives here
#   /etc/nginx/main.d/*.conf       main level: drop a `stream { ... }` here to
#                                  enable TCP/UDP proxying (off by default)
#
# APP_PORT (default 8080) is the port of the app container that the :80
# reverse-proxy leg forwards to; it must be listed with `env` to be readable
# from Lua.

worker_processes      1;
worker_rlimit_nofile  8192;
error_log             /dev/stderr warn;

env APP_PORT;

include /etc/nginx/main.d/*.conf;

events {
    worker_connections  4096;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout   75s;
    keepalive_requests  10000;

    include /etc/nginx/conf.d/*.conf;
}
