# Default sidecar config: transparent reverse proxy on :80, loopback forward
# proxy on 127.0.0.1:3128, and the sidecar's own metrics on :9145. No stream
# (TCP/UDP) proxying -- see /etc/nginx/nginx.conf to enable it.
#
# "Transparent" means requests reach the app as the client sent them: the Host
# header, the raw request URI, header names with underscores, bodies of any
# size, and WebSocket upgrades all pass through unchanged, and nothing is added
# (no X-Forwarded-*, no X-Real-IP). The app sees 127.0.0.1 as the peer.
#
# HTTPS interception is baked into the image (conf.d/intercept.conf +
# lib/intercept.lua) and OFF by default. The only app-visible hook is in the
# :3128 server below: it reads its tunnel target from lib/intercept.lua. Turn
# interception on by setting INTERCEPT_TLS=on and mounting a CA keypair at
# /etc/nginx/intercept/ca.crt + ca.key -- no config change needed.

lua_shared_dict ptr_cache           1M;
lua_shared_dict prometheus_metrics  4M;
lua_shared_dict custom_metrics      1M;
lua_package_path "/opt/prometheus/?.lua;/opt/prometheus/lib/?.lua;;";

init_worker_by_lua_block { require("http_metrics").init() }

client_max_body_size        0;
underscores_in_headers      on;
ignore_invalid_headers      off;
large_client_header_buffers 4 32k;

map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       "";
}

upstream app {
    server 0.0.0.1;
    balancer_by_lua_block {
        local balancer = require("ngx.balancer")
        local ok, err = balancer.set_current_peer("127.0.0.1", tonumber(os.getenv("APP_PORT")) or 8080)
        if not ok then
            ngx.log(ngx.ERR, "failed to set app peer: ", err)
            return ngx.exit(502)
        end
    }
    keepalive 64;
}

server {
    listen       80 default_server;
    server_name  _;

    set $request_mode 0;
    access_by_lua_block { require("http_metrics").classify_source() }
    log_by_lua_block    { require("http_metrics").record() }

    location / {
        proxy_pass               http://app;
        proxy_http_version       1.1;
        proxy_set_header         Host       $http_host;
        proxy_set_header         Upgrade    $http_upgrade;
        proxy_set_header         Connection $connection_upgrade;
        proxy_pass_header        Server;
        proxy_pass_header        Date;
        proxy_redirect           off;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_buffer_size        32k;
        proxy_buffers            4 32k;
        proxy_next_upstream      off;
        proxy_connect_timeout    5s;
        proxy_send_timeout       300s;
        proxy_read_timeout       300s;
    }
}

# Loopback-only forward proxy for the app's outbound traffic: point the app's
# HTTP_PROXY/HTTPS_PROXY at http://127.0.0.1:3128. CONNECT (HTTPS) uses nginx's
# native tunnel module; plain HTTP goes through proxy_pass.
#
# The CONNECT target comes from lib/intercept.lua: the local :3129 terminator
# when interception is enabled for this port/host, else the real host:port
# (identical to a bare `tunnel_pass;`). This is the whole opt-in surface.
server {
    listen  127.0.0.1:3128;

    resolver          local=on ipv6=off valid=10s;
    resolver_timeout  5s;

    set $request_mode 1;
    access_by_lua_block { require("http_metrics").classify_source() }
    log_by_lua_block    { require("http_metrics").record() }

    tunnel_connect_timeout  10s;
    tunnel_read_timeout     300s;
    tunnel_send_timeout     300s;

    location / {
        set_by_lua_block $connect_upstream { return require("intercept").upstream() }
        if ($request_method = CONNECT) {
            tunnel_pass $connect_upstream;
        }

        proxy_pass               http://$http_host$request_uri;
        proxy_http_version       1.1;
        proxy_set_header         Host                $http_host;
        proxy_set_header         Upgrade             $http_upgrade;
        proxy_set_header         Connection          $connection_upgrade;
        proxy_set_header         Proxy-Connection    "";
        proxy_set_header         Proxy-Authorization "";
        proxy_pass_header        Server;
        proxy_pass_header        Date;
        proxy_redirect           off;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_buffer_size        32k;
        proxy_buffers            4 32k;
        proxy_connect_timeout    10s;
        proxy_send_timeout       300s;
        proxy_read_timeout       300s;
    }
}

# The sidecar's own endpoints, on a separate port so they never shadow the
# app's routes and scrapes are never recorded as app traffic.
server {
    listen      9145;
    access_log  off;

    location = /metrics {
        content_by_lua_block { require("http_metrics").collect() }
    }

    location = /nginx_status {
        stub_status;
    }

    location = /healthz {
        default_type  text/plain;
        return        200 "ok\n";
    }

    location / {
        return 404;
    }
}