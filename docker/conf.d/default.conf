# Default sidecar config: transparent reverse proxy on :80, loopback forward
# proxy on 127.0.0.1:3128, and the sidecar's own metrics on :9145. No stream
# (TCP/UDP) proxying -- see /etc/nginx/nginx.conf to enable it.
#
# "Transparent" means requests reach the app as the client sent them: the
# Host header, the raw request URI, header names with underscores, bodies of
# any size, and WebSocket upgrades all pass through unchanged, and nothing is
# added (no X-Forwarded-*, no X-Real-IP). The app therefore sees 127.0.0.1 as
# the peer address; add those headers in your own default.conf if it needs
# the client IP.
#
# HTTPS interception (optional, off by default): the forward proxy can decrypt
# the app's outbound TLS to record real method/route/status instead of only
# CONNECT host:port. It is OPT-IN -- with nothing mounted, $tls_port is always
# 0, no CONNECT is ever routed to the terminator, and this image behaves as a
# plain pass-through proxy. Turn it on by mounting BOTH:
#   * a CA keypair (Secret) at /etc/nginx/intercept/ca.crt + ca.key  (this
#     container only -- the app gets ca.crt alone, see the k8s example), and
#   * a port map at /etc/nginx/intercept/ports/<port>.map containing e.g.
#       443 1;
# Hosts that must never be intercepted (outbound mTLS, cert pinning) go in
#   /etc/nginx/intercept/bypass/<name>.map   e.g.   pinned.example.com 1;

lua_shared_dict ptr_cache           1M;
lua_shared_dict prometheus_metrics  4M;
lua_shared_dict custom_metrics      1M;
lua_shared_dict ssl_mint_cache      10M;
lua_package_path "/opt/prometheus/?.lua;/opt/prometheus/lib/?.lua;;";

init_worker_by_lua_block { require("http_metrics").init() }

client_max_body_size        0;
underscores_in_headers      on;
ignore_invalid_headers      off;
large_client_header_buffers 4 32k;

map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       "";
}

# -- interception routing (opt-in) ------------------------------------------
# $tls_port          1 if the CONNECT target port is one we intercept (ships empty).
# $intercept_bypass  1 if the CONNECT target host must be passed through.
# $do_intercept      1 only for a CONNECT to an intercepted port on a non-bypassed
#                      host. http_metrics.record() skips this leg (the real call is
#                      recorded at :3129), and set_by_lua below routes it there.
map $request_port $tls_port {
    default 0;
    include /etc/nginx/intercept/ports/*.map;
}

map $host $intercept_bypass {
    default 0;
    include /etc/nginx/intercept/bypass/*.map;
}

map "$request_method:$tls_port:$intercept_bypass" $do_intercept {
    "CONNECT:1:0"  1;
    default        0;
}

upstream app {
    server 0.0.0.1;
    balancer_by_lua_block {
        local balancer = require("ngx.balancer")
        local ok, err = balancer.set_current_peer("127.0.0.1", tonumber(os.getenv("APP_PORT")) or 8080)
        if not ok then
            ngx.log(ngx.ERR, "failed to set app peer: ", err)
            return ngx.exit(502)
        end
    }
    keepalive 64;
}

server {
    listen       80 default_server;
    server_name  _;

    set $request_mode 0;
    access_by_lua_block { require("http_metrics").classify_source() }
    log_by_lua_block    { require("http_metrics").record() }

    location / {
        proxy_pass               http://app;
        proxy_http_version       1.1;
        proxy_set_header         Host       $http_host;
        proxy_set_header         Upgrade    $http_upgrade;
        proxy_set_header         Connection $connection_upgrade;
        proxy_pass_header        Server;
        proxy_pass_header        Date;
        proxy_redirect           off;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_buffer_size        32k;
        proxy_buffers            4 32k;
        proxy_next_upstream      off;
        proxy_connect_timeout    5s;
        proxy_send_timeout       300s;
        proxy_read_timeout       300s;
    }
}

# Loopback-only forward proxy for the app's outbound traffic: point the app's
# HTTP_PROXY/HTTPS_PROXY at http://127.0.0.1:3128. CONNECT (HTTPS) is handled
# by nginx's native ngx_http_tunnel_module (nginx >= 1.31); plain HTTP goes
# through proxy_pass. Any destination port is allowed.
#
# ONE if-with-content-handler only (two would trip nginx's "if is evil" and
# fall a CONNECT through to the proxy_pass below -> 500). The tunnel target is
# chosen by $connect_upstream: the local terminator when intercepting, else the
# real CONNECT target host:port (equivalent to a bare `tunnel_pass;`).
server {
    listen  127.0.0.1:3128;

    resolver          local=on ipv6=off valid=10s;
    resolver_timeout  5s;

    set $request_mode 1;
    access_by_lua_block { require("http_metrics").classify_source() }
    log_by_lua_block    { require("http_metrics").record() }

    tunnel_connect_timeout  10s;
    tunnel_read_timeout     300s;
    tunnel_send_timeout     300s;

    location / {
        set_by_lua_block $connect_upstream {
            if ngx.var.do_intercept == "1" then
                return "127.0.0.1:3129"
            end
            return (ngx.var.host or "") .. ":" .. (ngx.var.request_port or "443")
        }

        if ($request_method = CONNECT) {
            tunnel_pass $connect_upstream;
        }

        proxy_pass               http://$http_host$request_uri;
        proxy_http_version       1.1;
        proxy_set_header         Host                $http_host;
        proxy_set_header         Upgrade             $http_upgrade;
        proxy_set_header         Connection          $connection_upgrade;
        proxy_set_header         Proxy-Connection    "";
        proxy_set_header         Proxy-Authorization "";
        proxy_pass_header        Server;
        proxy_pass_header        Date;
        proxy_redirect           off;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_buffer_size        32k;
        proxy_buffers            4 32k;
        proxy_connect_timeout    10s;
        proxy_send_timeout       300s;
        proxy_read_timeout       300s;
    }
}

# HTTPS interception terminator (opt-in). A CONNECT routed here by :3128 is
# TLS-terminated with a leaf cert minted on the fly for the requested SNI
# (lib/tls_intercept.lua, signed by the mounted CA), so the decrypted request
# is recorded in full, then re-originated to the true destination over a
# VERIFIED TLS connection -- the app's end-to-end TLS guarantee is preserved,
# not dropped. Reached only when interception is switched on; see the header.
server {
    listen  127.0.0.1:3129 ssl;

    # Baked fallback so `openresty -t` and a no-SNI handshake have a cert;
    # ssl_certificate_by_lua_block replaces it per request with the minted leaf.
    ssl_certificate      /etc/nginx/intercept/fallback.crt;
    ssl_certificate_key  /etc/nginx/intercept/fallback.key;
    ssl_certificate_by_lua_block { require("tls_intercept").mint() }

    ssl_protocols        TLSv1.2 TLSv1.3;

    resolver          local=on ipv6=off valid=10s;
    resolver_timeout  5s;

    set $request_mode 1;
    access_by_lua_block { require("http_metrics").classify_source() }
    log_by_lua_block    { require("http_metrics").record() }

    # Re-originate to the real destination and VERIFY it -- without this the
    # sidecar would silently downgrade the app's TLS trust.
    proxy_ssl_server_name          on;
    proxy_ssl_name                 $host;
    proxy_ssl_verify               on;
    proxy_ssl_verify_depth         3;
    proxy_ssl_trusted_certificate  /etc/ssl/certs/ca-certificates.crt;

    location / {
        proxy_pass               https://$host$request_uri;
        proxy_http_version       1.1;
        proxy_set_header         Host       $http_host;
        proxy_set_header         Upgrade    $http_upgrade;
        proxy_set_header         Connection $connection_upgrade;
        proxy_pass_header        Server;
        proxy_pass_header        Date;
        proxy_redirect           off;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_buffer_size        32k;
        proxy_buffers            4 32k;
        proxy_connect_timeout    10s;
        proxy_send_timeout       300s;
        proxy_read_timeout       300s;
    }
}

# The sidecar's own endpoints, on a separate port so they never shadow the
# app's routes and scrapes are never recorded as app traffic.
server {
    listen      9145;
    access_log  off;

    location = /metrics {
        content_by_lua_block { require("http_metrics").collect() }
    }

    location = /nginx_status {
        stub_status;
    }

    location = /healthz {
        default_type  text/plain;
        return        200 "ok\n";
    }

    location / {
        return 404;
    }
}
