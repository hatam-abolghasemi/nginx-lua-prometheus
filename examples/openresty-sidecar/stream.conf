# Reference stream (TCP/UDP proxy) metrics config -- the stream-side
# counterpart to default.conf. All the actual logic lives in
# lib/stream_metrics.lua (orchestration) and lib/metrics_config.lua
# (everything you'd customize) -- this file is just wiring + the server{}
# blocks. See ../../FORK.md for a full explanation.
#
# nginx cannot share a shared dict between the http and stream modules (see
# the upstream README's "Usage in stream module" caveat), so this keeps its
# own Prometheus registry and its own exposition port (9254) rather than
# reusing prometheus_metrics/:80's /metrics.
#
# Deployment layout assumed by lua_package_path below (same package_path as
# default.conf -- these directives are per-module, so both http and stream
# need their own copies if you're running both):
#   /opt/prometheus/prometheus.lua              (upstream library)
#   /opt/prometheus/prometheus_keys.lua
#   /opt/prometheus/prometheus_resty_counter.lua
#   /opt/prometheus/lib/stream_metrics.lua       (this fork's modules)
#   /opt/prometheus/lib/metrics_config.lua       -- edit this one for your environment
#   /opt/prometheus/lib/gauge_expiry.lua
#   /opt/prometheus/lib/app_toggle.lua
#
# This file is meant to be dropped where your nginx.conf's `stream { }`
# block includes it, e.g. `stream { include /etc/nginx/stream.d/*.conf; }`.
# Replace all example values in lib/metrics_config.lua (destination names,
# resolver IP) with your own, and every `proxy_pass`/`resolver`/`listen`
# below, before deploying.

lua_shared_dict stream_metrics        3M;
lua_shared_dict stream_custom_metrics 1M;
lua_package_path "/opt/prometheus/?.lua;/opt/prometheus/lib/?.lua;;";

init_worker_by_lua_block { require("stream_metrics").init() }

# ── proxied destinations ──────────────────────────────────────────────────
# One server{} block per destination, each with its own log_by_lua_block
# (deliberately per-server, not shared at the top of this file, so the
# metrics-exposition server below never triggers it and never gets recorded
# as a phantom "destination" of its own). $destination_name feeds the
# "destination" label and the apps.stream per-destination switch in
# lib/metrics_config.lua -- give each destination you add its own entry
# there if you want to be able to disable its metrics independently.
server {
    listen                127.0.0.1:16379;  -- replace with your loopback/listen address
    set                   $destination_name "redis";
    proxy_pass            redis-cluster-headless:6379;  -- replace with your upstream
    resolver              10.233.0.3 valid=10s;  -- replace with your CoreDNS ClusterIP

    preread_by_lua_block { require("stream_metrics").connection_open() }
    log_by_lua_block { require("stream_metrics").record() }
}

# ── metrics exposition ────────────────────────────────────────────────────
# Separate port because this is a separate Prometheus registry from the one
# on :80/metrics -- point a distinct Prometheus scrape job at this port.
server {
    listen                9254;
    content_by_lua_block {
        ngx.print(require("stream_metrics").metric_data())
    }
}
