# Reference top-level nginx.conf that wires default.conf (HTTP) and
# stream.conf (TCP/UDP) together. Nothing in this file is fork-specific --
# it's the plain skeleton every OpenResty deployment needs; default.conf and
# stream.conf are where this fork's actual additions live. See ../../FORK.md.
#
# Deployment layout assumed:
#   /etc/nginx/nginx.conf              (this file)
#   /etc/nginx/conf.d/default.conf     (this fork's HTTP config)
#   /etc/nginx/stream.d/stream.conf    (this fork's stream config; omit the
#                                        `stream { }` block below entirely
#                                        if you have no TCP/UDP destinations)

worker_processes             1;
worker_rlimit_nofile         2048;
pid                           /run/nginx.pid;
error_log                     /dev/stderr warn;
include                       /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections        1024;
    use                       epoll;
}

http {
    include                   /usr/local/openresty/nginx/conf/mime.types;
    default_type              application/octet-stream;
    server_tokens             off;
    sendfile                  on;
    tcp_nopush                on;
    tcp_nodelay               on;
    keepalive_timeout         30;
    keepalive_requests        10000;
    client_body_timeout       30;
    send_timeout              15;
    reset_timedout_connection on;
    real_ip_header            X-Forwarded-For;
    real_ip_recursive         on;

    # default.conf (lua_shared_dict, lua_package_path, and all server{}
    # blocks) is dropped here.
    include                   /etc/nginx/conf.d/*.conf;
}

stream {
    # stream.conf (lua_shared_dict, lua_package_path, and all server{}
    # blocks) is dropped here. Omit this whole `stream { }` block if you
    # have no TCP/UDP destinations to proxy.
    include                   /etc/nginx/stream.d/*.conf;
}
