# Reference sidecar config: inbound request metrics (via nginx-lua-prometheus)
# with caller identification, plus an outbound forward proxy sharing the
# same metrics pipeline. All the actual logic lives in lib/http_metrics.lua
# (orchestration) and lib/metrics_config.lua (everything you'd customize)
# -- this file is just wiring + the server{} blocks. See ../../FORK.md for
# a full explanation of each piece: what it does, why, its requirements,
# and how to verify it.
#
# Deployment layout assumed by lua_package_path below:
#   /opt/prometheus/prometheus.lua              (upstream library)
#   /opt/prometheus/prometheus_keys.lua
#   /opt/prometheus/prometheus_resty_counter.lua
#   /opt/prometheus/lib/http_metrics.lua         (this fork's modules)
#   /opt/prometheus/lib/metrics_config.lua       -- edit this one for your environment
#   /opt/prometheus/lib/route_sanitizer.lua
#   /opt/prometheus/lib/host_classifier.lua
#   /opt/prometheus/lib/client_subnet.lua
#   /opt/prometheus/lib/gauge_expiry.lua
#   /opt/prometheus/lib/source_attribution.lua
#   /opt/prometheus/lib/app_toggle.lua
#
# Replace every example value in lib/metrics_config.lua (app/namespace
# names, IP ranges, resolver IP) with your own before deploying.

lua_shared_dict ptr_cache        1M;
lua_shared_dict prometheus_metrics 3M;
lua_shared_dict custom_metrics   1M;
lua_package_path "/opt/prometheus/?.lua;/opt/prometheus/lib/?.lua;;";

init_worker_by_lua_block { require("http_metrics").init() }
access_by_lua_block      { require("http_metrics").classify_source() }
log_by_lua_block         { require("http_metrics").record() }

# ── outbound (forward-proxy) leg ──────────────────────────────────────────
# Loopback-only. Requires an OpenResty build patched with
# ngx_http_proxy_connect_module (not in stock OpenResty) -- see FORK.md
# ("Forward proxy" section). Point the application container's HTTP_PROXY/HTTPS_PROXY at
# 127.0.0.1:3128 to route its outbound calls through here.
server {
    set                            $request_mode 1;
    listen                         127.0.0.1:3128;
    resolver                       10.233.0.3 valid=10s;  -- replace with your CoreDNS ClusterIP
    resolver_timeout               5s;

    proxy_connect;
    proxy_connect_allow            all;  -- intentionally permissive: outbound TLS in this environment isn't confined to port 443, and plain HTTP requests already flow through location / below regardless of this setting -- see FORK.md's "Forward proxy" section
    proxy_connect_connect_timeout  10s;
    proxy_connect_read_timeout     10s;
    proxy_connect_send_timeout     10s;

    location / {
        proxy_pass                 $scheme://$http_host$request_uri;
        proxy_set_header           Host $http_host;
        proxy_http_version         1.1;
        proxy_set_header           Connection "";
    }
}

# ── inbound (reverse-proxy) leg ───────────────────────────────────────────
# Replace `proxy_pass http://app;` with your actual upstream (fastcgi_pass,
# a different proxy_pass target, etc.) -- this block intentionally has no
# application-specific routing in it.
upstream app {
    server 127.0.0.1:9000;
}

server {
    set                             $request_mode 0;
    listen                          80 default_server;
    server_name                     _;

    location / {
        proxy_pass                 http://app;
        proxy_set_header           Host $host;
        proxy_set_header           X-Real-IP $remote_addr;
        proxy_set_header           X-Forwarded-For $remote_addr;
        proxy_set_header           X-Forwarded-Proto $scheme;
    }

    location /nginx_status {
        stub_status                 on;
        access_log                  off;
        allow                       172.16.0.0/12;  -- replace with your internal range
        deny                        all;
    }

    location = /metrics {
        content_by_lua_block { require("http_metrics").collect() }
        access_log                  off;
    }
}
