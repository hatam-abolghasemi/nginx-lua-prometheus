# Sample Deployment showing the sidecar pattern this fork's config assumes:
# an "app" container (your actual application -- not part of this fork,
# replace it entirely) plus an "nginx" sidecar container running the
# ConfigMaps from configmaps.yaml. All names, images, and addresses below
# are mock/placeholder values -- replace every one before deploying.
#
# The `reloader.stakater.com/auto: "true"` annotation is optional: it makes
# https://github.com/stakater/Reloader roll this Deployment automatically
# when configmaps.yaml changes. Remove it if you don't run that controller
# -- without it, a ConfigMap change needs a manual rollout to take effect.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: example-namespace
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/component: app
  annotations:
    reloader.stakater.com/auto: "true"  # optional, see note above
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-app
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-app
        app.kubernetes.io/component: app
    spec:
      imagePullSecrets:
      - name: registry-credentials  # mock -- your image pull secret, if any

      containers:
      # ── your application -- not part of this fork ──────────────────────
      # Replace this entire container with your actual app. The only
      # contract default.conf assumes is: something listening on
      # 127.0.0.1:9000 that the `upstream app { server 127.0.0.1:9000; }`
      # block in default.conf can proxy_pass to.
      - name: app
        image: registry.example.com/example/app:v1.0.0  # mock
        ports:
        - name: app
          containerPort: 9000
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 3
          periodSeconds: 3
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi

      # ── this fork's nginx sidecar ───────────────────────────────────────
      - name: nginx
        # Build this image with ngx_http_proxy_connect_module baked in if
        # you want the forward-proxy leg (FORK.md section 8) -- otherwise
        # any recent stock OpenResty image works; just remove the
        # 127.0.0.1:3128 server{} block from default.conf.
        image: registry.example.com/example/openresty:1.27.1-egress-1  # mock
        imagePullPolicy: Always
        env:
        - name: TZ
          value: UTC
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: stream-metrics
          containerPort: 9254
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 80
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 80
          periodSeconds: 15
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: default-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: stream-conf
          mountPath: /etc/nginx/stream.d/stream.conf
          subPath: stream.conf
          readOnly: true
        - name: metrics-config
          mountPath: /opt/prometheus/lib/metrics_config.lua
          subPath: metrics_config.lua
          readOnly: true
        # prometheus.lua, prometheus_keys.lua, prometheus_resty_counter.lua,
        # and the rest of lib/*.lua (http_metrics.lua, stream_metrics.lua,
        # and the six pure modules) are intentionally NOT mounted from a
        # ConfigMap -- they're versioned Lua code, not environment-specific
        # config, so bake them into the `nginx` image above at
        # /opt/prometheus instead (matching lua_package_path in
        # default.conf/stream.conf). That keeps the image tag as the thing
        # you pin and roll back, the same way you'd already pin any other
        # library version. metrics_config.lua above is the one exception:
        # it's plain data (app/namespace names, toggles, IP ranges), so it's
        # mounted over the image-baked copy at that same path -- change it
        # via this ConfigMap without rebuilding the image.

      volumes:
      - name: nginx-conf
        configMap:
          name: sidecar-nginx-conf
      - name: default-conf
        configMap:
          name: sidecar-default-conf
      - name: stream-conf
        configMap:
          name: sidecar-stream-conf
      - name: metrics-config
        configMap:
          name: sidecar-metrics-config
